<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>دارینو — مدیریت هوشمند دارایی شخصی</title>
    <meta
      name="description"
      content="دارینو — مدیریت هوشمند دارایی شخصی: پایش پورتفولیو، شبیه‌سازی سرمایه‌گذاری، حسابداری و تحلیل بازار"
    />
    <meta name="theme-color" content="#F6F8FC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090D1B" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="دارینو" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      /* pre-hydration: themed background + calm splash (no white/dark flash in the installed app) */
      html { background: #F6F8FC; }
      html.dark { background: #090D1B; }
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #boot svg { width: 56px; height: 56px; animation: boot 1.4s ease-in-out infinite; }
      @keyframes boot { 50% { opacity: .45; } }
      @media (prefers-reduced-motion: reduce) { #boot svg { animation: none; } }
    </style>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('app:theme') || 'null');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><div id="boot" aria-label="دارینو در حال بارگذاری"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="bt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3D6BFF"/><stop offset="1" stop-color="#1837B0"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#bt)"/><rect x="14" y="37" width="7" height="12" rx="2.5" fill="#fff" opacity=".55"/><rect x="24" y="27" width="7" height="22" rx="2.5" fill="#fff" opacity=".8"/><path d="M34 15 A17 17 0 0 1 34 49 Z" fill="#fff"/></svg></div></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
